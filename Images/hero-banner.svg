<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yash Rawalkar — Full-Stack Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="78%" stop-color="#7ee2b8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ee2b8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.035"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f16"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }

    .terminal   { animation: terminalFade 16s ease-in-out infinite; }
    .tline1     { animation: lineFade 16s ease-in-out infinite; animation-delay: 0s; }
    .tline2     { animation: lineFade 16s ease-in-out infinite; animation-delay: .35s; }
    .tline3     { animation: lineFade 16s ease-in-out infinite; animation-delay: .9s; }
    .tline4     { animation: lineFade 16s ease-in-out infinite; animation-delay: 1.25s; }
    .tline5     { animation: lineFade 16s ease-in-out infinite; animation-delay: 1.8s; }
    .cursor     { animation: blink 1s steps(2) infinite; }

    .name       { animation: bigFade 16s ease-in-out infinite; }
    .role       { animation: bigFade 16s ease-in-out infinite; animation-delay: .3s; }
    .tagline    { animation: bigFade 16s ease-in-out infinite; animation-delay: .6s; }
    .stack      { animation: bigFade 16s ease-in-out infinite; animation-delay: .95s; }

    @keyframes terminalFade {
      0%, 100% { opacity: 0; transform: translateY(6px); }
      4%       { opacity: 1; transform: translateY(0); }
      33%      { opacity: 1; transform: translateY(0); }
      39%      { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes lineFade {
      0%, 4%  { opacity: 0; }
      9%      { opacity: 1; }
      33%     { opacity: 1; }
      37%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }
    @keyframes bigFade {
      0%, 40%  { opacity: 0; transform: translateY(10px); }
      46%      { opacity: 1; transform: translateY(0); }
      75%      { opacity: 1; transform: translateY(0); }
      81%      { opacity: 0; transform: translateY(-8px); }
      100%     { opacity: 0; }
    }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grain)"/>

  <!-- Terminal scene -->
  <g class="terminal">
    <rect x="150" y="46" width="900" height="176" rx="12" fill="#0d1117" stroke="#212833" stroke-width="1"/>
    <rect x="150" y="46" width="900" height="30" rx="12" fill="#11161d"/>
    <rect x="150" y="64" width="900" height="12" fill="#11161d"/>
    <circle cx="174" cy="61" r="5.5" fill="#ff5f56"/>
    <circle cx="192" cy="61" r="5.5" fill="#ffbd2e"/>
    <circle cx="210" cy="61" r="5.5" fill="#27c93f"/>
    <text x="600" y="65" text-anchor="middle" class="mono" font-size="11" fill="#5b6472">yash@dev — zsh</text>

    <text x="178" y="102" class="mono tline1" font-size="15" fill="#7ee2b8">$ whoami</text>
    <text x="178" y="126" class="mono tline2" font-size="15" fill="#c9d1d9">&gt; yash_rawalkar</text>
    <text x="178" y="150" class="mono tline3" font-size="15" fill="#7ee2b8">$ cat focus.txt</text>
    <text x="178" y="174" class="mono tline4" font-size="15" fill="#c9d1d9">&gt; full-stack engineering, AI-integrated products</text>
    <text x="178" y="198" class="mono tline5" font-size="15" fill="#c9d1d9">&gt; shipping weekly<tspan class="mono cursor" fill="#7ee2b8">_</tspan></text>
  </g>

  <!-- Identity scene -->
  <g>
    <text x="600" y="148" text-anchor="middle" class="sans name" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="1">YASH RAWALKAR</text>
    <text x="600" y="188" text-anchor="middle" class="sans role" font-size="18" font-weight="600" fill="#58a6ff" letter-spacing="3">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="600" y="224" text-anchor="middle" class="sans tagline" font-size="15" fill="#8b949e">Building scalable applications and turning ideas into products that solve real-world problems.</text>
    <text x="600" y="270" text-anchor="middle" class="mono stack" font-size="15" fill="#7ee2b8" letter-spacing="1">React · Node.js · TypeScript · AI</text>
  </g>

  <rect x="0" y="314" width="1200" height="2" fill="url(#edge)"/>
</svg>
